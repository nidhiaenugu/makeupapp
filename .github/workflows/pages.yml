name: Deploy standalone app to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The published site is just the single-file build, renamed to index.html
      # so it serves at the domain root with no path.
      - run: npm run build:standalone
      - run: mv dist/glowmatch.html dist/index.html

      # enablement: true lets this action turn Pages on for the repo the
      # first time this workflow runs, instead of requiring someone to
      # click "GitHub Actions" as the source in Settings → Pages first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
